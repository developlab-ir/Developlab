{% load static %}
{% load i18n %}

<header
    class="bg-dark text-light border-bottom border-warning border-3 d-flex flex-wrap align-items-center justify-content-between py-3 px-4">

    <div class="d-flex align-items-center">
        <a href="/" class="text-decoration-none">
            <img src="{% static 'img/favicon/android-chrome-192x192.png' %}" width="64" height="64" alt="Logo">
        </a>
    </div>

    <ul class="nav">
        <li class="nav-item">
            <a href="{% url 'core:home' %}" class="nav-link text-warning">
                آزمایشگاه توسعه
            </a>
        </li>

        <li class="nav-item">
            <a href="{% url 'blog:index' %}" class="nav-link text-light">
                وبلاگ
            </a>
        </li>

        <li class="nav-item">
            <a href="{% url 'qa:question-list' %}" class="nav-link text-light">
                پرسش و پاسخ
            </a>
        </li>

        <li class="nav-item">
            <a href="#" class="nav-link text-light">
                DevGit
            </a>
        </li>
    </ul>

    <div class="d-flex align-items-center gap-3">
        <div>
        {% if not user.is_authenticated  %}
            <a href="{% url 'accounts:login'  %}" type="button" class="btn btn-outline-warning me-2">
                ورود
            </a>

            <a href="{% url 'accounts:signup'  %}" type="button" class="btn btn-warning">
                ثبت نام
            </a>
        {% else %}
            <a href="{% url 'accounts:profile' user.username %}" type="button" class="btn btn-outline-warning me-2">
                {{ user }}
            </a>
        {% endif %}
        </div>

    </div>

</header>
